# Type: reusable | Called by ci-pipeline.yml
# Builds Docker images via docker-bake.hcl and pushes to ECR.
# Skips build if images already exist for the current commit SHA (rerun optimization).
name: Build Images

on:
  workflow_call:
    outputs:
      image_tag:
        description: "Short SHA used as image tag"
        value: ${{ jobs.build.outputs.image_tag }}
      ecr_registry:
        description: "ECR registry URL"
        value: ${{ jobs.build.outputs.ecr_registry }}
      ecr_repo:
        description: "ECR repository name"
        value: ${{ jobs.build.outputs.ecr_repo }}
      ecr_region:
        description: "AWS region for ECR"
        value: ${{ jobs.build.outputs.ecr_region }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'staging' }}
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
      ecr_repo: ${{ steps.vars.outputs.ecr_repo }}
      ecr_region: ${{ steps.vars.outputs.ecr_region }}
    env:
      REGION: ${{ vars.TO_REGION }}
      AWS_ECR_NAME: ${{ vars.TO_ECR_NAME }}
      ENVIRONMENT_TAG: ${{ github.ref_name == 'prod' && 'prod' || 'staging' }}
      # INCLUDE_TEST_ENDPOINTS is derived from ENVIRONMENT_TAG in the
      # "Derive build flags" step below (KEEP-237).
      # Static NEXT_PUBLIC_* flags with no Parameter Store backing stay as
      # GHA environment vars.
      NEXT_PUBLIC_AUTH_PROVIDERS: ${{ vars.NEXT_PUBLIC_AUTH_PROVIDERS }}
      NEXT_PUBLIC_BILLING_ENABLED: ${{ vars.NEXT_PUBLIC_BILLING_ENABLED }}
      NEXT_PUBLIC_GAS_SPONSORSHIP_ENABLED: ${{ vars.NEXT_PUBLIC_GAS_SPONSORSHIP_ENABLED }}
      # NEXT_PUBLIC_GITHUB_CLIENT_ID, NEXT_PUBLIC_GOOGLE_CLIENT_ID,
      # NEXT_PUBLIC_TURNSTILE_SITE_KEY and NEXT_PUBLIC_SENTRY_DSN are read from
      # SSM Parameter Store in the "Fetch NEXT_PUBLIC_* from SSM" step so the
      # values baked into the client bundle match what the running pods read at
      # runtime via External Secrets (single source of truth, no drift).
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Derive build flags
        run: |
          if [[ "$ENVIRONMENT_TAG" != "prod" ]]; then
            echo "INCLUDE_TEST_ENDPOINTS=true" >> "$GITHUB_ENV"
          fi

      - name: Check commit message for skip flags
        id: skip
        run: |
          MSG=$(git log -1 --format=%B)
          echo "skip_build=$([[ "$MSG" == *"[skip build]"* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.TO_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TO_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract commit hash and ECR coordinates
        id: vars
        run: |
          SHA=$(git rev-parse --short HEAD)
          if [[ -z "$SHA" || ${#SHA} -lt 7 ]]; then
            echo "::error::Failed to resolve commit SHA (got '${SHA}')"
            exit 1
          fi
          {
            echo "sha_short=${SHA}"
            echo "ecr_repo=${AWS_ECR_NAME}"
            echo "ecr_region=${REGION}"
          } >> "$GITHUB_OUTPUT"

      - name: Check if images already exist
        id: check-image
        run: |
          IMAGE_TAG="${{ steps.vars.outputs.sha_short }}"
          ALL_EXIST=true
          for prefix in app migrator workflow-runner; do
            if aws ecr describe-images \
              --repository-name "${{ env.AWS_ECR_NAME }}" \
              --image-ids "imageTag=${prefix}-${IMAGE_TAG}" \
              --region "${{ env.REGION }}" >/dev/null 2>&1; then
              echo "${prefix}-${IMAGE_TAG} exists"
            else
              echo "${prefix}-${IMAGE_TAG} not found"
              ALL_EXIST=false
            fi
          done
          echo "exists=${ALL_EXIST}" >> "$GITHUB_OUTPUT"

      - name: Fail fast if build skipped but image missing
        if: steps.skip.outputs.skip_build == 'true' && steps.check-image.outputs.exists != 'true'
        run: |
          echo "::error::Cannot skip build: one or more images for ${{ steps.vars.outputs.sha_short }} do not exist in ECR. Remove [skip build] from the commit message or push a build first."
          exit 1

      # Source the SSM-backed NEXT_PUBLIC_* values at build time so the values
      # inlined into the client bundle are identical to what the running pods
      # read from the same Parameter Store paths via External Secrets. Runs in
      # the per-environment GitHub Environment (prod|staging) so vars/secrets -
      # including the AWS creds configured above - resolve to the right account.
      #
      # Path is per-environment via ${ENVIRONMENT_TAG} (prod|staging).
      # Region is NOT the cluster/ECR region (TO_REGION): SSM is centralized in
      # us-east-2 (staging clusters run in us-east-1, prod in us-east-2), so the
      # read uses a dedicated SSM_REGION that defaults to us-east-2 and can be
      # overridden per environment via the SSM_REGION variable if that changes.
      - name: Fetch NEXT_PUBLIC_* from SSM
        if: steps.skip.outputs.skip_build != 'true' && steps.check-image.outputs.exists != 'true'
        env:
          SSM_PREFIX: /eks/techops-${{ env.ENVIRONMENT_TAG }}/keeperhub
          SSM_REGION: ${{ vars.SSM_REGION || 'us-east-2' }}
        run: |
          set -euo pipefail
          fetch() {
            local var="$1" path="$2" val
            val=$(aws ssm get-parameter --name "$path" --with-decryption \
              --query 'Parameter.Value' --output text --region "$SSM_REGION")
            echo "::add-mask::$val"
            echo "$var=$val" >> "$GITHUB_ENV"
          }
          fetch NEXT_PUBLIC_TURNSTILE_SITE_KEY "$SSM_PREFIX/turnstile-site-key"
          fetch NEXT_PUBLIC_GITHUB_CLIENT_ID   "$SSM_PREFIX/github-client-id"
          fetch NEXT_PUBLIC_GOOGLE_CLIENT_ID   "$SSM_PREFIX/google-client-id"
          fetch NEXT_PUBLIC_SENTRY_DSN         "$SSM_PREFIX/next-public-sentry-dsn"

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip_build != 'true' && steps.check-image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push all images to ECR
        if: steps.skip.outputs.skip_build != 'true' && steps.check-image.outputs.exists != 'true'
        uses: docker/bake-action@v7
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO: ${{ env.AWS_ECR_NAME }}
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
          NEXT_PUBLIC_AUTH_PROVIDERS: ${{ env.NEXT_PUBLIC_AUTH_PROVIDERS }}
          NEXT_PUBLIC_GITHUB_CLIENT_ID: ${{ env.NEXT_PUBLIC_GITHUB_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ env.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_BILLING_ENABLED: ${{ env.NEXT_PUBLIC_BILLING_ENABLED }}
          NEXT_PUBLIC_GAS_SPONSORSHIP_ENABLED: ${{ env.NEXT_PUBLIC_GAS_SPONSORSHIP_ENABLED }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ env.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          ENVIRONMENT_TAG: ${{ env.ENVIRONMENT_TAG }}
          INCLUDE_TEST_ENDPOINTS: ${{ env.INCLUDE_TEST_ENDPOINTS }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ env.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ env.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ env.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ steps.vars.outputs.sha_short }}
        with:
          files: docker-bake.hcl
          push: true

      - name: Upload Sentry source maps
        if: steps.skip.outputs.skip_build != 'true' && steps.check-image.outputs.exists != 'true'
        uses: docker/bake-action@v7
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO: ${{ env.AWS_ECR_NAME }}
          NEXT_PUBLIC_AUTH_PROVIDERS: ${{ env.NEXT_PUBLIC_AUTH_PROVIDERS }}
          NEXT_PUBLIC_GITHUB_CLIENT_ID: ${{ env.NEXT_PUBLIC_GITHUB_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ env.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_BILLING_ENABLED: ${{ env.NEXT_PUBLIC_BILLING_ENABLED }}
          NEXT_PUBLIC_GAS_SPONSORSHIP_ENABLED: ${{ env.NEXT_PUBLIC_GAS_SPONSORSHIP_ENABLED }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ env.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ env.NEXT_PUBLIC_SENTRY_DSN }}
          INCLUDE_TEST_ENDPOINTS: ${{ env.INCLUDE_TEST_ENDPOINTS }}
          SENTRY_ORG: ${{ env.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ env.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ steps.vars.outputs.sha_short }}
        with:
          files: docker-bake.hcl
          targets: sentry-upload

      # ── Copy images to TechOps ECR ──
      - name: Configure TechOps AWS credentials
        if: steps.skip.outputs.skip_build != 'true' && steps.check-image.outputs.exists != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.TO_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TO_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.TO_REGION }}

      - name: Login to TechOps ECR
        if: steps.skip.outputs.skip_build != 'true' && steps.check-image.outputs.exists != 'true'
        id: login-techops-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Copy images to TechOps ECR
        if: steps.skip.outputs.skip_build != 'true' && steps.check-image.outputs.exists != 'true'
        env:
          SRC_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          DST_REGISTRY: ${{ steps.login-techops-ecr.outputs.registry }}
          ECR_REPO: ${{ env.AWS_ECR_NAME }}
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          for prefix in app migrator workflow-runner; do
            echo "Copying ${prefix}-${IMAGE_TAG} to TechOps ECR..."
            docker buildx imagetools create \
              --tag "${DST_REGISTRY}/${ECR_REPO}:${prefix}-${IMAGE_TAG}" \
              "${SRC_REGISTRY}/${ECR_REPO}:${prefix}-${IMAGE_TAG}"
          done
          echo "TechOps ECR push complete"
