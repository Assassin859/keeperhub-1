name: Protocol Nightly

# Nightly depth for protocol node coverage: the full ephemeral e2e run
# (including the per-action protocol suites and Tier 1 simulations) plus
# the Tier 0 mutation check that proves the calldata tests still have
# teeth. PR runs stay fast; breadth and falsification live here. See
# specs/protocol-coverage-methodology.md.

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  # Granted through to e2e-tests-ephemeral.yml (called workflows can
  # only downgrade caller permissions): the tier1 job lists/downloads
  # the nightly fork-snapshot artifact.
  actions: read

jobs:
  e2e-full:
    uses: ./.github/workflows/e2e-tests-ephemeral.yml
    with:
      caller_event: schedule
    secrets: inherit

  # Warm fork-state snapshot: start a mainnet fork pinned behind head,
  # run the Tier 1 sweep once so every transaction-touched account and
  # storage slot is committed locally, then publish the anvil state
  # dump as an artifact. The tier1-simulations job in the ephemeral
  # workflow loads the latest snapshot via --load-state, so its hot
  # path stops depending on live upstream state mid-execution (the
  # failure mode that blocked the 2026-07-06 prod release). The
  # e2e-full run above stays on a live fork as the canary. Snapshot
  # mechanics are documented in scripts/protocol-local.sh (snapshot
  # subcommand and start_fork).
  fork-snapshot-mainnet:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Start anvil Ethereum mainnet fork pinned behind head
        env:
          ANVIL_FORK_MAINNET_URL: ${{ secrets.ANVIL_FORK_MAINNET_URL }}
        run: |
          UPSTREAM="${ANVIL_FORK_MAINNET_URL:-https://ethereum-rpc.publicnode.com}"
          # Pin a few blocks behind head (same rationale as
          # scripts/protocol-local.sh start_fork): every node behind a
          # load-balanced upstream already has the block, and the dump
          # is only valid at the exact block its values were fetched at,
          # so the consumer must be able to re-pin there.
          HEAD_HEX=$(curl -sf -m 10 -X POST -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
            "$UPSTREAM" | grep -oE '"result":"0x[0-9a-f]+"' | cut -d'"' -f4)
          PIN=$((HEAD_HEX - 12))
          echo "PIN=$PIN" >> "$GITHUB_ENV"
          echo "pinning mainnet fork at block $PIN"
          docker run -d --name snapshot-anvil-mainnet -p 8548:8545 --entrypoint anvil \
            ghcr.io/foundry-rs/foundry:latest \
            --host 0.0.0.0 --fork-url "$UPSTREAM" --fork-block-number "$PIN" \
            --chain-id 1 --block-time 1
          retries=0
          until curl -sf -X POST http://localhost:8548 \
                -H "Content-Type: application/json" \
                -d '{"jsonrpc":"2.0","method":"eth_chainId","id":1}' | grep -q '"0x1"'; do
            retries=$((retries + 1))
            if [ "$retries" -ge 30 ]; then
              echo "anvil mainnet fork did not become ready in 60s"
              docker logs snapshot-anvil-mainnet || true
              exit 1
            fi
            sleep 2
          done

      - name: Warm the fork with the Tier 1 sweep (chain 1)
        run: |
          pnpm vitest run tests/e2e/vitest/protocol-simulation \
            --reporter=default --reporter=json --outputFile=sim-results.json
          # Same floor as the tier1-simulations CI job: a dump taken
          # from a self-skipping sweep would be warm for almost nothing,
          # and publishing it would silently push consumers back onto
          # live upstream state.
          pnpm tsx scripts/protocol-coverage-floor.ts sim-results.json 150
        env:
          PROTOCOL_SIM_RPC_1: http://localhost:8548

      - name: Dump warmed fork state
        run: |
          mkdir -p fork-snapshot
          pnpm tsx scripts/dump-anvil-state.ts http://localhost:8548 "fork-snapshot/ethereum-${PIN}.json"
          ls -la fork-snapshot/

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v7
        with:
          name: fork-snapshot-mainnet
          path: fork-snapshot/
          retention-days: 3

  mutation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run mutation check
        run: RUN_LOCAL=1 scripts/protocol-mutation-check.sh
